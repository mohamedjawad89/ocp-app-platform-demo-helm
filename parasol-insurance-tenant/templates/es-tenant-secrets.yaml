{{- include "tenant.validate" . }}
{{- $prefix := include "parasol-insurance-tenant.prefix" . -}}
{{- $tenantPath := printf "secrets/tenants/%s" .Values.tenant.username -}}
---
# Tenant Quay pull secret — sourced from kv/secrets/tenants/<user>/quay/auth
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tenant-quay-pull-secret
  namespace: {{ $prefix }}-build
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: tenant-vault
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ $tenantPath }}/quay/auth
        property: value
  target:
    name: tenant-quay-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
    creationPolicy: Owner
---
# Tenant Quay credentials (raw username/password) for Tekton task env
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tenant-quay-credentials
  namespace: {{ $prefix }}-build
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: tenant-vault
  data:
    - secretKey: username
      remoteRef:
        key: {{ $tenantPath }}/quay/username
        property: value
    - secretKey: password
      remoteRef:
        key: {{ $tenantPath }}/quay/password
        property: value
  target:
    name: tenant-quay-credentials
    creationPolicy: Owner
# NOTE: A per-tenant Postgres password is provisioned in Vault at
# {{ $tenantPath }}/db-password by the Vault setup Job (T016) but is
# NOT yet consumed here. Wiring it through requires coordinated changes
# to the parasol-insurance app manifests (in the tenant GitLab repo)
# which is out-of-scope for this chart-side iteration. v2 follow-up.
