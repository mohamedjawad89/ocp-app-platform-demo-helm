gitlab:
  image: quay.io/redhat-gpte/gitlab:17.4.1
  email:
    address: "gitlab@rhdemo.com"
    displayName: "GitLab Admin"
    replyTo: "noreply@rhdemo.com"
  smtp:
    enabled: "false"
    domain: "rhdemo.com"
    host:
    port: "587"
    user: "gitlab"
    password: "gitlab"
  ssh:
    host:
    port: "22"
  rootPassword:
  host:
  https: "true"
  rootEmail: "root@rhdemo.com"
  keyBase:
    db: "0123456789"
    otp: "0123456789"
    secret: "0123456789"
  # User accounts are derived from `tenants[]` and `platformEngineers[]` (passed
  # from app-of-apps). Optional friendly-name overrides go here; entries not
  # listed default to "<id> developer" / "<id> platform engineer".
  users:
    password:
    displayNames: {}
      # Example:
      # dev1: Dave Developer
      # pe1: Paul PlatEngineer
  # Tenant groups (`tenant-<id>`) are generated per-tenant by the init playbook
  # from `tenants[]`. Only platform-shared groups belong here.
  groups:
    - name: rhdh
      repo:
        - name: developer-hub-config
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-developer-hub-config.git
        - name: rhdh-entities
          url: https://github.com/redhat-pe-workshop/pe-workshop-entities.git
        - name: template-developer-self-service
          url: https://github.com/redhat-pe-workshop/rhdh-template-developer-self-service.git
        - name: devfiles
          url: https://github.com/redhat-ads-tech/devfiles.git
        - name: rhdh-templates
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-rhdh-templates.git
        - name: helm-charts
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-apps-helm.git
        - name: infra-app-of-apps
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-infra-app-of-apps.git
      users:
        - id: pe1
        - id: pe2
      project:
        - name: rhdh-issues
          labels:
            - name: approved
              color: green
            - name: denied
              color: red
  # Per-tenant clone-template-push of `parasol-insurance` is handled separately
  # in cm-gitlab-templates.yaml by iterating tenants[]. The list below is for
  # platform-shared template targets only (rhdh-templates).
  templates:
    - group: rhdh
      project: rhdh-templates
      branch: main
      templates:
        - templates/parasol-insurance-secured/template.yaml
        - templates/request-kafka-topic/template.yaml
        - templates/request-kafka-user/template.yaml
        - templates/quarkus-rest-api/template.yaml
  # Per-tenant `parasol-insurance` source-repo template-target. Cloned per tenant
  # from `tenant-<id>/parasol-insurance` and pushed back after templating.
  tenantSourceTemplates:
    branch: main
    templates:
      - devfile.yaml
postgresql:
  dbUser: gitlab
  dbPassword: passw0rd
  dbName: gitlab_production

cluster:
  subdomain: 

gitops:
  namespace:
  project: default

quay:
  host: 

vault:
  name: vault
  namespace: vault

orchestrator:
  # As of RHDH 1.8.0, the orchestrator namespace is in the RHDH (backstage) namespace
  namespace: backstage
